      .bar-pct { font-size: 11px; fill: #8888aa; }
      .bar-bg { fill: #1a1a2e; rx: 2; }
      .bar-fill-green { fill: #00ffaa; }
      .bar-fill-blue { fill: #4499ff; }
      .bar-fill-purple { fill: #bb88ff; }
      .bar-fill-amber { fill: #ffaa44; }
      .scanline { stroke: #00ffaa22; stroke-width: 1; }
      .prompt { font-size: 12px; fill: #00ffaa; font-weight: bold; letter-spacing: 1px; }
    </style>
    <!-- animated bar clips -->
    <clipPath id="cl"><rect x="0" y="0" width="0" height="10"><animate attributeName="width" from="0" to="1000" dur="1.2s" fill="freeze"/></rect></clipPath>
