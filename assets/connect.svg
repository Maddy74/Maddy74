<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 90" width="860" height="90" font-family="'Courier New',Courier,monospace">
  <rect width="860" height="90" fill="#09090f" rx="0"/>
  <rect x="10" y="8" width="840" height="74" fill="#0d0d1a" stroke="#1e1e3a" stroke-width="1" rx="6"/>

  <text x="24" y="30" font-size="12" fill="#00ffaa" font-weight="bold">maddy@dev</text>
  <text x="101" y="30" font-size="12" fill="#555">:</text>
  <text x="108" y="30" font-size="12" fill="#4499ff">~</text>
  <text x="118" y="30" font-size="12" fill="#555">$</text>
  <text x="126" y="30" font-size="12" fill="#c8c8e8"> ./connect.sh</text>

  <line x1="24" y1="38" x2="836" y2="38" stroke="#1e1e3a" stroke-width="1"/>

  <!-- GitHub button -->
  <rect x="24" y="48" width="140" height="26" fill="#0d0d1a" stroke="#00ffaa44" stroke-width="1" rx="3"/>
  <text x="94" y="65" font-size="10" fill="#00ffaa" text-anchor="middle" letter-spacing="1">[ GITHUB ↗ ]</text>

  <!-- Live project button -->
  <rect x="176" y="48" width="160" height="26" fill="#0d0d1a" stroke="#4499ff44" stroke-width="1" rx="3"/>
  <text x="256" y="65" font-size="10" fill="#4499ff" text-anchor="middle" letter-spacing="1">[ LIVE PROJECT ↗ ]</text>

  <!-- Bengaluru tag -->
  <text x="520" y="65" font-size="10" fill="#555">Location: Bengaluru, India 🇮🇳</text>

  <!-- cursor -->
  <rect x="24" y="76" width="8" height="10" fill="#00ffaa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
