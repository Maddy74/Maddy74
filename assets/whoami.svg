<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160" font-family="'Courier New',Courier,monospace">
  <rect width="860" height="160" fill="#09090f" rx="0"/>

  <!-- terminal box -->
  <rect x="10" y="10" width="840" height="140" fill="#0d0d1a" stroke="#1e1e3a" stroke-width="1" rx="6"/>

  <!-- prompt line -->
  <text x="24" y="36" font-size="12" fill="#00ffaa" font-weight="bold">maddy@dev</text>
  <text x="101" y="36" font-size="12" fill="#555">:</text>
  <text x="108" y="36" font-size="12" fill="#4499ff">~</text>
  <text x="118" y="36" font-size="12" fill="#555">$</text>
  <text x="126" y="36" font-size="12" fill="#c8c8e8"> cat whoami.txt</text>

  <line x1="24" y1="44" x2="836" y2="44" stroke="#1e1e3a" stroke-width="1"/>

  <!-- output lines -->
  <text x="36" y="64" font-size="11" fill="#555">&gt;</text>
  <text x="50" y="64" font-size="11" fill="#c8c8e8">Software Engineer · Full-Stack &amp; Backend Development</text>

  <text x="36" y="84" font-size="11" fill="#555">&gt;</text>
  <text x="50" y="84" font-size="11" fill="#c8c8e8">Passionate about building scalable applications and AI-powered products</text>

  <text x="36" y="104" font-size="11" fill="#555">&gt;</text>
  <text x="50" y="104" font-size="11" fill="#c8c8e8">Experienced with MERN &amp; Java · Exploring Cloud, DevOps &amp; AI</text>

  <text x="36" y="124" font-size="11" fill="#555">&gt;</text>
  <text x="50" y="124" font-size="11" fill="#c8c8e8">Microservices · SAGA · Reactive APIs · Cloud-native · Bengaluru 🇮🇳</text>

  <!-- blinking cursor -->
  <rect x="24" y="134" width="8" height="12" fill="#00ffaa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
